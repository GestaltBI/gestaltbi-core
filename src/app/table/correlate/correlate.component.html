<div class="explore">
  <mat-card class="analysis-filter">
    <sbi-filter localFilter="correlate" localState="correlate">
      <sbi-periodfilter></sbi-periodfilter>
    </sbi-filter>
  </mat-card>

  <mat-card class="explore__controls">
    <sbi-correlate-controls (selectionChange)="onSelection($event)"></sbi-correlate-controls>
    <p class="explore__note">{{ 'explore.caveat' | translate }}</p>
  </mat-card>

  <p class="explore__empty" *ngIf="loaded && !rowData.length">{{ 'explore.noPairs' | translate }}</p>

  <ag-grid-angular
    *ngIf="rowData.length"
    class="ag-theme-alpine explore__grid"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
  >
  </ag-grid-angular>
</div>
