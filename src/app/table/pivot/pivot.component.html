<div class="explore">
  <mat-card class="analysis-filter">
    <sbi-filter localFilter="pivot" localState="pivot">
      <sbi-periodfilter></sbi-periodfilter>
    </sbi-filter>
  </mat-card>

  <mat-card class="explore__controls">
    <sbi-pivot-controls (selectionChange)="onSelection($event)"></sbi-pivot-controls>
    <p class="explore__note" *ngIf="omitted > 0">
      {{ 'explore.folded' | translate: { count: omitted } }}
    </p>
  </mat-card>

  <p class="explore__empty" *ngIf="loaded && !pivotable">{{ 'explore.noDimensions' | translate }}</p>

  <ag-grid-angular
    *ngIf="columnDefs.length"
    class="ag-theme-alpine explore__grid"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
  >
  </ag-grid-angular>
</div>
