<div class="filter">
  <div class="filter__body">
    <!-- Global filters attach their scope-specific filter here; local ones
         leave selectedPortal unset and project their content instead. Only
         one of the two is ever populated for a given instance. -->
    <ng-template [cdkPortalOutlet]="selectedPortal"></ng-template>
    <ng-content></ng-content>
  </div>
  <div class="filter__actions">
    <button class="btn btn--ghost btn--sm" (click)="reset()">
      <mat-icon>refresh</mat-icon>
      <span>{{ 'common.reset' | translate }}</span>
    </button>
    <button class="btn btn--solid btn--sm" (click)="save()">
      <mat-icon>check</mat-icon>
      <span>{{ 'common.select' | translate }}</span>
    </button>
  </div>
</div>
