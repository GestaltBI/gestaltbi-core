<div fxLayout="column" fxLayoutGap="24px">
  <mat-card class="analysis-filter" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="48px">
    <div fxLayout="row" fxLayoutAlign="center center">
      <span class="color-accent">{{ 'filter.periodA' | translate }}</span>
      <sbi-filter localFilter="changeA" localState="filterL">
        <sbi-periodfilter span="first"></sbi-periodfilter>
      </sbi-filter>
    </div>
    <div fxLayout="row" fxLayoutAlign="center center">
      <span class="color-accent">{{ 'filter.periodB' | translate }}</span>
      <sbi-filter localFilter="changeB" localState="filterR">
        <sbi-periodfilter span="second"></sbi-periodfilter>
      </sbi-filter>
    </div>
  </mat-card>
  <div fxLayout="row" fxLayoutAlign="center center">
    <div
      fxFlex
      echarts
      [theme]="theme"
      [merge]="mergeOptionA"
      [options]="chartOption"
      (chartInit)="onChartInit($event)"
    ></div>
    <div
      fxFlex="20"
      echarts
      [theme]="theme"
      [merge]="mergeOptionB"
      [options]="barChartOption"
      (chartInit)="onBarChartInit($event)"
    ></div>
  </div>
</div>
